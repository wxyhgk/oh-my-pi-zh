name: 发布 npm 包

# 手动触发(workflow_dispatch)或推送 v* tag 时发布:
#   1. 矩阵构建各平台原生模块(natives)
#   2. 生成并发布 5 个平台叶子包(@wxyhgk/pi-natives-<平台>)
#   3. 发布 14 个主包与 TS 包(含 @wxyhgk/pi-coding-agent,bin 为 omp-zh)
#
# 需要配置仓库 Secret:NPM_TOKEN(你的 npm access token,发布权限)

on:
   workflow_dispatch:
   push:
      tags:
         - "v*"

permissions:
   contents: read

jobs:   # 原生模块构建矩阵:darwin 两个平台在 mac 上构建,linux 全家桶 + win32 在
   # ubuntu 上构建(bazel 交叉编译,上游同款目标清单)。
   build-natives:
      name: 构建原生模块 (${{ matrix.name }})
      strategy:
         fail-fast: false
         matrix:
            include:
               - name: darwin
                 runner: macos-14 # arm64;darwin-all 含 darwin-x64 交叉编译
                 targets: darwin-all
               - name: linux-win
                 runner: ubuntu-22.04
                 targets: linux-all # linux 全平台 + win32-x64
      runs-on: ${{ matrix.runner }}
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              version: 1.3.14

         - name: 安装 bazelisk 与 cmake
           run: |
              if [ "$RUNNER_OS" = "Linux" ]; then
                sudo apt-get update
                sudo apt-get install -y cmake
                curl -fsSL https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o /usr/local/bin/bazelisk
                chmod +x /usr/local/bin/bazelisk
              else
                brew install cmake bazelisk
              fi
              bazelisk version

         - name: 构建原生模块
           run: |
              export PATH="$HOME/.bun/bin:$PATH"
              # 逐个 target 构建,避免并发链接 OOM(上游同款做法)
              for target in ${{ matrix.targets == 'darwin-all' && 'darwin-arm64 darwin-x64-baseline' || 'linux-arm64 linux-musl-arm64 linux-musl-x64-baseline linux-x64-baseline linux-x64-modern win32-x64-baseline' }}; do
                bun scripts/bazel-natives.ts "$target" --dest packages/natives/native
              done

         - name: 上传原生模块产物
           uses: actions/upload-artifact@v4
           with:
              name: natives-${{ matrix.name }}
              path: packages/natives/native/*.node
              if-no-files-found: error

   # 汇总所有平台产物 → 生成叶子包 → 依次发布叶子包、主包与 TS 包。
   publish:
      name: 发布到 npm
      needs: build-natives
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      permissions:
         contents: read
         id-token: write # npm OIDC trusted publishing(配置后无需 NPM_TOKEN)
      steps:
         - uses: actions/checkout@v4

         - uses: oven-sh/setup-bun@v2
           with:
              version: 1.3.14

         - name: 汇总各平台原生模块
           uses: actions/download-artifact@v4
           with:
              pattern: natives-*
              path: packages/natives/native
              merge-multiple: true

         - name: 核对产物清单
           run: |
              ls -la packages/natives/native/
              for f in \
                pi_natives.linux-x64-baseline.node \
                pi_natives.linux-x64-modern.node \
                pi_natives.linux-arm64.node \
                pi_natives.darwin-x64-baseline.node \
                pi_natives.darwin-arm64.node \
                pi_natives.win32-x64-baseline.node; do
                [ -f "packages/natives/native/$f" ] || { echo "缺少 $f"; exit 1; }
              done

         - name: 安装依赖
           run: bun install --frozen-lockfile

         - name: 配置 npm 认证
           run: |
              npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
              npm whoami
           env:
              # OIDC trusted publishing 可用时 npm 自动走 OIDC;否则 fallback 到该 token
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

         - name: 生成叶子包
           run: bun --cwd=packages/natives run gen:npm

         - name: 发布叶子包(5 个平台)
           run: |
              for tag in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
                echo "== 发布 @wxyhgk/pi-natives-$tag =="
                bun scripts/ci-release-publish.ts --native-leaf "$tag"
              done

         - name: 发布主包与 TS 包
           run: bun scripts/ci-release-publish.ts
